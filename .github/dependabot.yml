version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels: ["dependencies"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels: ["dependencies"]
    open-pull-requests-limit: 5

  # Sandbox images. A base-image bump changes the container digest that findings
  # are pinned to, so these are reviewed rather than auto-merged.
  - package-ecosystem: docker
    directories:
      - "/images/base"
      - "/images/mockgw"
      - "/images/claude-code"
      - "/images/codex-cli"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels: ["dependencies", "sandbox"]
