version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels: ["dependencies"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels: ["dependencies"]
    open-pull-requests-limit: 5

  # Sandbox images (implementation Task 7 created them). A base-image bump
  # changes the container digest every exported finding is pinned to (R11), so
  # it changes what the test suite means -- reviewed, never auto-merged, and
  # monthly rather than weekly.
  #
  # claude-code and codex-cli are FROM reprobe/base:dev, which is built locally
  # and has no registry tag to track, so Dependabot has nothing to update in
  # them. Only the two images with an upstream base are listed.
  - package-ecosystem: docker
    directories:
      - "/images/base"
      - "/images/mockgw"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels: ["dependencies", "sandbox"]
