version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels: ["dependencies"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels: ["dependencies"]
    open-pull-requests-limit: 5

  # -------------------------------------------------------------------------
  # The docker ecosystem stays commented out until images/*/Dockerfile exist
  # (implementation Task 7). Dependabot reports `dependency_file_not_found`
  # and fails on every scheduled run otherwise, which trains everyone to
  # ignore a red mark.
  # -------------------------------------------------------------------------
  # Sandbox images. A base-image bump changes the container digest that
  # findings are pinned to, so these are reviewed rather than auto-merged.
  #
  # - package-ecosystem: docker
  #   directories:
  #     - "/images/base"
  #     - "/images/mockgw"
  #     - "/images/claude-code"
  #     - "/images/codex-cli"
  #   schedule:
  #     interval: monthly
  #   commit-message:
  #     prefix: "chore"
  #   labels: ["dependencies", "sandbox"]
