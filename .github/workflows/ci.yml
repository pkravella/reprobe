name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # The repo commits `.python-version` (3.11) as the local default, and uv
      # honours that file for BOTH `sync` and `run` — so without this the 3.12
      # leg would silently run on 3.11 and test nothing new. `--python` on sync
      # alone does not hold, because `uv run` re-resolves from the pin file.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --all-extras --dev

      - name: Confirm the interpreter matches the matrix leg
        run: |
          actual="$(uv run python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          echo "matrix=${{ matrix.python-version }} actual=$actual"
          [ "$actual" = "${{ matrix.python-version }}" ]

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Unit tests
        # --cov-fail-under guards against silent coverage rot: the suite sits
        # at 99% (only cli.py's NotImplementedError stubs are uncovered), and a
        # whole module losing its tests would blow past this floor. The number
        # is deliberately below the real figure so a single hard-to-cover line
        # does not turn into a red build.
        run: >
          uv run pytest tests/unit -v
          --cov=reprobe --cov-report=term-missing --cov-fail-under=95

  integration:
    name: integration
    runs-on: ubuntu-latest
    # Image builds pull base images and npm-install an agent CLI, so this is
    # slower than the unit legs; the budget is generous rather than tight.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --dev

      # Only the images the integration suite actually uses. codex-cli is left
      # out because no integration test needs it, which skips a second
      # agent-CLI npm install. The GitHub ubuntu runner ships Docker, so there
      # is nothing to set up.
      - name: Build sandbox images
        run: make base claude-code mockgw fakeagent

      # The safety-critical half of the project: the images build and run
      # unprivileged, strace observes real syscalls, the gateway blocks and
      # logs egress, the internal network isolates a trial, and the fake agent
      # drives the whole pipeline end to end. The fake agent is what makes this
      # free -- before it, this job would have cost money or an API key on
      # every PR, which is why the suite ran only locally until now.
      - name: Integration tests
        run: REPROBE_DOCKER_TESTS=1 uv run pytest tests/integration -v -m docker

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Reprobe ships a corpus of adversarial payloads. The project's own rule
      # is that nothing in it may contain a real credential or target a real
      # collection endpoint, so that rule is enforced mechanically rather than
      # trusted to review. See CONTRIBUTING.md, "The one hard rule".
      - name: No real-looking credentials in the tree
        run: |
          set -o pipefail
          patterns='sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{50,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AIza[0-9A-Za-z_-]{35}'
          if git grep -nIE "$patterns" -- . ':!.github/workflows/ci.yml' ; then
            echo "::error::A real-looking credential pattern is present in the tree."
            echo "Synthetic canaries must use the RPRB_CANARY_ prefix. See CONTRIBUTING.md."
            exit 1
          fi
          echo "No credential patterns found."

      - name: Personal planning documents are not tracked
        run: |
          if git ls-files --error-unmatch 'PRD*.md' 2>/dev/null \
             || git ls-files 'docs/superpowers/*' | grep -q . ; then
            echo "::error::A personal planning document is tracked. These belong in .gitignore."
            exit 1
          fi
          echo "No planning documents tracked."

      - name: Required community files are present
        run: |
          missing=0
          for f in LICENSE NOTICE README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md CHANGELOG.md; do
            if [ ! -f "$f" ]; then echo "::error::missing $f"; missing=1; fi
          done
          exit $missing

  # A single stable check for branch protection to require. Matrix jobs get
  # names like "check (3.11)", so requiring them directly would break the
  # moment the Python matrix changes; this gate does not.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, integration, hygiene]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A required CI job failed."
          exit 1
      - run: echo "All required jobs succeeded."
