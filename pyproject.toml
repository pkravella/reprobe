[project]
# Distribution name (what users install). It differs from the import package
# because `reprobe` is already taken on PyPI; see docs/naming.md.
name = "reprobe-agents"
version = "0.1.0.dev0"
description = "Turn an agent security failure into a reproducible regression test."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Pranith Ravella", email = "pranithravella@gmail.com" },
]
keywords = [
    "ai-security",
    "prompt-injection",
    "fuzzing",
    "ai-agents",
    "red-teaming",
    "regression-testing",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "docker>=7.2.0",
    "jinja2>=3.1.6",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.urls]
Homepage = "https://github.com/pkravella/reprobe"
Repository = "https://github.com/pkravella/reprobe"
Changelog = "https://github.com/pkravella/reprobe/blob/main/CHANGELOG.md"
Issues = "https://github.com/pkravella/reprobe/issues"

[project.scripts]
reprobe = "reprobe.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

# `uv init` infers the module directory from the distribution name and would
# look for `src/reprobe_agents/`. The import package is `reprobe`, so say so.
[tool.uv.build-backend]
module-name = "reprobe"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

# The docker SDK ships no type information and publishes no stub package, so
# strict mode cannot see through it. Scope the allowance to that import only.
[[tool.mypy.overrides]]
module = ["docker.*"]
ignore_missing_imports = true

[tool.coverage.run]
# docker_sandbox.py is the one module that cannot be unit-tested: it is a thin
# orchestration layer over a live Docker daemon, exercised entirely by the
# docker-marked integration suite (which CI runs as a required job). Its pure
# helper, compose_command, IS unit-tested. Omitting it keeps the unit-coverage
# floor meaningful for code that unit tests can actually reach, instead of
# dragging the number down with lines only a daemon can run.
omit = ["*/reprobe/sandbox/docker_sandbox.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs a Docker daemon; skipped unless REPROBE_DOCKER_TESTS=1",
    "agent: spends real agent/API budget; skipped unless REPROBE_AGENT_TESTS=1",
    "reprobe: a Reprobe-generated regression test",
]
addopts = "-m 'not docker and not agent'"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]
